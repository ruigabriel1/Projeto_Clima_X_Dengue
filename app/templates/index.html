<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prodígia | Dashboard Climático</title>
  
  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Estilos -->
  <link rel="stylesheet" href="/static/css/modern.css">
  
  <!-- Plotly (Apenas a biblioteca gráfica) -->
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<body class="dark-mode">

  <div class="app-container">
    
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="brand">
        <h1>Prodígia</h1>
        <p>Previsão Climática & Saúde</p>
      </div>

      <div class="control-panel">
        <h3>Painel de Controle</h3>
        
        <button id="btnTreinar" class="btn-primary">
          ▶ Reprocessar ML (Otimizado)
        </button>

        <div id="progressContainer" class="progress-container">
          <div class="progress-bar-bg">
            <div id="progressFill" class="progress-bar-fill"></div>
          </div>
          <span id="progressLabel" class="progress-label">0%</span>
        </div>
      </div>

      <div class="control-panel">
        <h3>Aparência</h3>
        <button id="themeToggle" class="btn-outline">☀️ Tema Claro</button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      
      <!-- Loading Overlay -->
      <div id="loader" class="loader-overlay active">
        <div class="spinner"></div>
      </div>

      <div class="top-bar">
        <h2>Dashboard Analítico - São Carlos (SC)</h2>
      </div>

      <!-- STATUS CARDS -->
      <section class="stats-grid">
        <div class="stat-card">
          <span class="stat-label">Municípios</span>
          <span class="stat-value" id="totalMunicipios">-</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Período Histórico</span>
          <span class="stat-value" id="periodoDados">-</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Projeção Até</span>
          <span class="stat-value" id="projecaoAte">-</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Casos Totais Previstos (SSP2-4.5)</span>
          <span class="stat-value text-ssp245" id="totalCasosProjetados">-</span>
        </div>
      </section>

      <!-- CHARTS -->
      <section id="chartsGrid" class="charts-grid">
        <!-- Linha 1 -->
        <div class="chart-card">
          <div id="chartCenarios" style="width:100%; height:400px;"></div>
        </div>
        
        <!-- Linha 2: Lado a Lado -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
          <div class="chart-card">
            <div id="chartSazonal" style="width:100%; height:350px;"></div>
          </div>
          <div class="chart-card">
            <div id="chartHeatmap" style="width:100%; height:350px;"></div>
          </div>
        </div>

        <!-- Linha 3 -->
        <div class="chart-card">
          <div class="chart-header">
            <h3>Tabela de Projeções Analíticas</h3>
          </div>
          <div class="table-responsive">
            <table id="resumoTable" class="data-table">
              <thead>
                <tr>
                  <th>Ano Base</th>
                  <th>SSP1-2.6 (Otimista)</th>
                  <th>SSP2-4.5 (Moderado)</th>
                  <th>SSP5-8.5 (Pessimista)</th>
                </tr>
              </thead>
              <tbody>
                <!-- Preenchido via JS -->
              </tbody>
            </table>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- App Modules -->
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
