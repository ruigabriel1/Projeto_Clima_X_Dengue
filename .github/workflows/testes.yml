# Roda os testes (só dados sintéticos) a cada push e pull request. O resultado fica visível na aba
# Actions e no selo do README: qualquer pessoa vê se o projeto está passando sem instalar nada.
name: testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
