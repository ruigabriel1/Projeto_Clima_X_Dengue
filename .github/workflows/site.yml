# Versão estática da aplicação no GitHub Pages.
# Baixa os modelos e o banco da Release (os dados não ficam no git), calcula as respostas de todos os municípios
# (python main.py exportar-site) e publica a pasta site/. Roda quando a aplicação muda, quando sai uma Release nova
# (dados do mês) ou manualmente (aba Actions → site → Run workflow).
name: site

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ["app/**", "src/prediction_service/**", "main.py", "requirements-api.txt", ".github/workflows/site.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt
      - run: pip install -r requirements-api.txt
      - name: Baixar modelos e banco da Release (confere SHA-256)
        run: python -m src.prediction_service.artefatos garantir
      - name: Calcular as respostas de todos os municípios
        run: python main.py exportar-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
